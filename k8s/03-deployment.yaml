apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: erp
  labels: { app: inventory-service, tier: backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: inventory-service }
  template:
    metadata:
      labels: { app: inventory-service, tier: backend }
    spec:
      containers:
        - name: inventory-service
          image: inventory-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3001 }]
          envFrom:
            - configMapRef: { name: inventory-service-config }
          env:
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: inventory-service-db-secret, key: POSTGRES_DB } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: inventory-service-db-secret, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: inventory-service-db-secret, key: POSTGRES_PASSWORD } }
          readinessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 192Mi }
